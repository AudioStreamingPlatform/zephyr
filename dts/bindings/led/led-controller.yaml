# Common fields for LED controllers and child LEDs

properties:
  led-max-microamp:
    type: int
    description: |
      Maximum current that can be delivered to the led by defaul.
      Meant to limit the amount a current a led can take, so tweaking
      delivered current will not go over this value. Beware that, if
      wrongly set, it will enable the possibility of hardware damage
      led side. Such setting can be overriden per-led (see led-node).

child-binding:
  description: LED child node

  include: led-node.yaml

  properties:
    index:
      type: int
      description: |
        Index of the LED on a controller. It can be used by drivers or
        applications to map a logical LED to its real position on the
        controller. For example, this allows to handle boards where the
        LEDs in an array/strip are not wired following the LED order of
        the controller.
