description: TI MSPM0 SPI

compatible: "ti,mspm0-spi"

include: [spi-controller.yaml, pinctrl-device.yaml, base.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  clocks:
    required: true

  ti,clk-div:
    type: int
    required: true
    description: Sets the division ratio for the clock, which controls how the
      clock frequency is divided before use.
