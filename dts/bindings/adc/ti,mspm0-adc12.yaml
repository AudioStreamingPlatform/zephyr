description: TI MSPM0 ADC12

compatible: "ti,mspm0-adc12"

include: [adc-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  "#io-channel-cells":
    const: 1

  ti,clk-range:
    type: int
    required: true
    description: |
      ADC clock range.
      Must be selected accordingly to the selected clocks.
      Check available options in dt_bindings/adc/mspm0_adc.h

  ti,clk-div:
    type: int
    required: true
    description: Sample clock divider, applies to the selected clocks.

  vref-mv:
    type: int
    default: 2500
    description: Voltage reference in mV

io-channel-cells:
  - input
