tests:
  debug.coredump.in_memory:
    tags: coredump
    timeout: 30
    ignore_faults: true
    ignore_qemu_crash: true
    filter: CONFIG_ARCH_SUPPORTS_COREDUMP
#    platform_allow:
    arch_exclude:
      - posix
    integration_platforms:
      - qemu_cortex_m0
    harness: console
    harness_config:
      type: multi_line
      regex:
        - "IN-MEMORY COREDUMP FOUND [0-9]+"
