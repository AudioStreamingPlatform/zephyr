description: TI MSPM0 UART

compatible: "ti,mspm0-uart"

include: [uart-controller.yaml, pinctrl-device.yaml, base.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  clk-div:
    type: int
    default: 1
    enum:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
    description: |
      Clock divider selection value.

  rx-fifo-threshold:
    type: string
    default: "1_2_full"
    enum:
      - "one_entry"
      - "1_4_full"
      - "1_2_full"
      - "3_4_full"
      - "full"
    description: |
      RX FIFO interrupt threshold level. Interrupt fires when the FIFO
      reaches this level. Defaults to `1_2_full` (half full). Use `one_entry` for
      protocols that require per-byte interrupt delivery.

  tx-fifo-threshold:
    type: string
    default: "empty"
    enum:
      - "one_entry"
      - "1_4_empty"
      - "1_2_empty"
      - "3_4_empty"
      - "empty"
    description: |
      TX FIFO interrupt threshold level. Interrupt fires when the FIFO
      reaches this level. Defaults to `empty`.
