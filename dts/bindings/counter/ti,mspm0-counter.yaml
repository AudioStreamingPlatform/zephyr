description: Driver to enable MSPM0 Hardware Timers. Currently it only supports TIMG{0, 6, 7, 12}.

include: [base.yaml]

compatible: "ti,mspm0-counter"

properties:
  mode:
    type: int
    required: true

  reg:
    required: true

  interrupts:
    required: true

  resolution:
    type: int
    required: true

  clocks:
    required: true

  ti,prescaler:
    required: true
    type: int
    default: 0
    description: Specifies the value used to divide the input clock frequency,
      allowing adjustment of the effective clock rate used by the timer.

  ti,divider:
    type: int
    required: true
    description: Sets the division ratio for the clock, which controls how the
      clock frequency is divided before use.