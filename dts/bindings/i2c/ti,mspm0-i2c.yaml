# SPDX-License-Identifier: Apache-2.0

description: TI MSPM0 I2C

compatible: "ti,mspm0-i2c"

include: [i2c-controller.yaml, pinctrl-device.yaml, base.yaml]

properties:
  reg:
    required: true

  scl-gpios:
    type: phandle-array
    description: |
      GPIO the SCL line is muxed to. Optional, but required for bus recovery:
      i2c_recover_bus() re-muxes SCL and SDA to GPIO, clocks the bus until a
      target that was left mid-byte releases SDA, issues a STOP and restores
      the pinctrl state. Without these the recover_bus callback reports
      -ENOTSUP and a target holding SDA low wedges the bus permanently.

  sda-gpios:
    type: phandle-array
    description: |
      GPIO the SDA line is muxed to. See scl-gpios.

  transfer-timeout-ms:
    type: int
    description: |
      Per-message transfer timeout in milliseconds. 0 means wait forever.
      Defaults to CONFIG_I2C_MSPM0_TRANSFER_TIMEOUT when not set.

      The right value is a property of what is on the bus, which is why it is
      per instance. A target that legitimately stretches SCL for a long time
      needs a timeout longer than that stretch, otherwise the controller
      abandons a valid transfer mid-byte and leaves the target driving SDA low,
      wedging the bus. A bus on which this SoC is itself a target for a host
      with its own timeout needs a much shorter one, so the SoC gives up before
      the host does.

  target-mode-only:
    type: boolean
    description: |
      Will skip setup of i2c-controller mode when no target is registered.
      This can be useful for when only target mode is wanted.

  interrupts:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  watchdog-timer:
    type: phandle
    description: |
      The type of the phandle object should be a counter device.
      When the system is crashing, the I2C lines (SDA/SCL) are not being
      reset and might stay LOW. To address this issue, we need to ensure that
      none of the user i2c driver callbacks (that are doing reads or writes)
      are taking longer than CONFIG_I2C_MSPM0_WATCHDOG_TIMEOUT. So we
      fire a timer before each call. If the callback doesn't finish fast
      enough, the watchdog callback will reset the i2c lines, NACK the i2c
      message and panic with the CONFIG_MSPM0_I2C_WATCHDOG_PANIC_CODE
      error code.

  clocks:
    required: true

  ti,clk-div:
    type: int
    required: true
    default: 1
    enum:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
    description: Sets the division ratio for the clock, which controls how the
      clock frequency is divided before use.
